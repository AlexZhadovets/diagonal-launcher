name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); just accept licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode signing key from secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets (see README → Signing)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build release APK
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
          rm -f app/release.jks

      # Surface compiler / lint errors as public annotations (logs need sign-in to read).
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|e: |Error:|Lint found|What went wrong|\.java:[0-9]+" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk diagonal-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diagonal-launcher
          path: diagonal-launcher.apk

      # A release gives a plain download link that opens straight on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Diagonal Launcher (build ${{ github.run_number }})
          make_latest: true
          files: diagonal-launcher.apk
