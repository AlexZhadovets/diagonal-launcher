plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diagonal.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diagonal.launcher'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '1.0'
    }

    // Fixed key so every new build installs over the previous one (personal sideload use only).
    signingConfigs {
        fixed {
            storeFile file('signing.jks')
            storePassword 'diagonal123'
            keyAlias 'diagonal'
            keyPassword 'diagonal123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
