plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diagonal.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diagonal.launcher'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '1.0'
    }

    // Release key comes from GitHub Secrets (decoded by the workflow into app/release.jks).
    // Nothing secret is stored in the repository.
    signingConfigs {
        fixed {
            storeFile file('release.jks')
            storePassword System.getenv('SIGNING_PASSWORD') ?: ''
            keyAlias 'diagonal'
            keyPassword System.getenv('SIGNING_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
